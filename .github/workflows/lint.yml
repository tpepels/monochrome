name: Lint Codebase

on:
    workflow_dispatch:

permissions:
    contents: read

jobs:
    lint:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.3.11

            - name: Install dependencies
              run: bun install

            - name: Run JS Lint
              run: bun run lint:js

            - name: Run CSS Lint
              run: bun run lint:css

            - name: Check formatting
              run: bunx prettier --check .

            - name: Run HTML Lint
              run: bun run lint:html
