name: Run Tests

on:
    push:
        branches: ['main']
    pull_request:
        branches: ['main']
    workflow_dispatch:

permissions:
    contents: read

jobs:
    test:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4
              with:
                  fetch-depth: 1

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.3.11

            - name: Check self-host invariants
              run: bun run check:selfhost

            - name: Cache dependencies
              uses: actions/cache@v4
              with:
                  path: |
                      ./node_modules
                      ~/.bun/install/cache
                  key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-bun-

            - name: Install dependencies
              run: bun install

            - name: Install playwright dependencies
              run: bun run install:playwright

            - name: Run browser tests
              run: >
                  HEADLESS=true bunx vitest run --config=vite.config.ts
                  --exclude "server/downloads/**/*.test.js"

            - name: Run self-host server tests
              run: bunx vitest run --config=vitest.server.config.ts
