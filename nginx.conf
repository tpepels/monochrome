server {
    listen 4173;
    listen [::]:4173;

    root /usr/share/nginx/html;
    index index.html;

    # Resolve the optional self-host backend at request time so the frontend
    # can still start cleanly if the backend container is temporarily absent.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $monochrome_backend monochrome-server:4174;

    location ~* \.(?:css|js|mjs|map|json|wasm|mp3|flac|wav|ogg|png|jpg|jpeg|svg|webp|ico|gz|br|utf|ttf|woff2?)$ {
        try_files $uri =404;
    }

    location ^~ /api/downloads {
        proxy_pass http://$monochrome_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # SELF-HOST INVARIANT:
    # Standalone download administration intentionally lives outside the
    # upstream Monochrome router/UI. Keep this proxy when rebasing upstream.
    location ^~ /downloads-admin {
        proxy_pass http://$monochrome_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # SELF-HOST INVARIANT:
    # Browser access to Tracks MUST stay same-origin. Metadata, audio and artwork
    # all rely on this exact prefix. Do not remove/rename it during upstream
    # rebases without updating getTracksClientBaseUrl() and the invariant guard.
    # Proxy directly from nginx instead of relaying large audio through Bun.
    location ^~ /api/provider/tracks/ {
        proxy_pass https://tracks.monochrome.st/;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_ssl_name tracks.monochrome.st;
        proxy_set_header Host tracks.monochrome.st;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
